apiVersion: v1
kind: ConfigMap
metadata:
  name: technitium-sophos-sync-config
  labels:
    app.kubernetes.io/name: technitium-sophos-sync
data:
  TECHNITIUM_URL: "http://192.168.1.10:5380"
  TECHNITIUM_TIMEOUT: "10.0"
  SOPHOS_FIREWALL_IP: "192.168.1.1"
  SOPHOS_FIREWALL_PORT: "4444"
  SOPHOS_USER: "admin"
  SOPHOS_CLIENTLESS_GROUP: "Clientless Open Group"
  SOPHOS_API_VERSION: "2200.1"
  SOPHOS_VERIFY_SSL: "false"
  SOPHOS_TIMEOUT: "15.0"
  STATIC_LEASES_ONLY: "false"
  SYNC_INTERVAL: "300"
  DRY_RUN: "false"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: technitium-sophos-sync-secret
  labels:
    app.kubernetes.io/name: technitium-sophos-sync
type: Opaque
stringData:
  TECHNITIUM_TOKEN: "YOUR_TECHNITIUM_API_TOKEN"
  SOPHOS_PASS: "YOUR_SOPHOS_ADMIN_PASSWORD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium-sophos-sync
  labels:
    app.kubernetes.io/name: technitium-sophos-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: technitium-sophos-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technitium-sophos-sync
    spec:
      containers:
        - name: sync
          image: ghcr.io/jelmervdm/technitium-sophos-sync:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: technitium-sophos-sync-config
            - secretRef:
                name: technitium-sophos-sync-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
